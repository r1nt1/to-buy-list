<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Groceries</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>

  <!-- ============ TRIP ============ -->
  <section class="view" id="view-trip">

    <header class="topbar">
      <h1>This trip</h1>
      <button class="ghost" id="finish-trip">Finish trip</button>
    </header>

    <!-- hidden until at least one item has a price -->
    <div class="budget hidden" id="budget">
      <button class="budget-row" id="budget-toggle">
        <span class="budget-cart" id="budget-cart"></span>
        <span class="budget-caret" id="budget-caret">⌄</span>
      </button>
      <div id="budget-detail">
        <label class="budget-set">budget
          <input type="number" id="budget-input" min="0" step="1" inputmode="decimal">
        </label>
        <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
        <p class="budget-note" id="budget-note"></p>
      </div>
    </div>

    <form class="add" id="add-form">
      <input id="add-input" placeholder="Add an item…" autocomplete="off"
             enterkeyhint="done" list="item-names">
      <datalist id="item-names"></datalist>
      <button type="submit">Add</button>
    </form>

    <div class="segmented" id="view-toggle">
      <button class="seg on"  data-mode="priority">By priority</button>
      <button class="seg"     data-mode="store">By store</button>
    </div>

    <div id="trip-list"></div>
  </section>

  <!-- ============ ALL ITEMS ============ -->
  <section class="view hidden" id="view-all">

    <header class="topbar">
      <h1>All items</h1>
      <span class="count" id="all-count"></span>
    </header>

    <p class="explainer">Everything you ever buy. Checking something off never deletes it —
       it just leaves this trip and waits here for next time.</p>

    <input class="search" id="search" placeholder="Search…" autocomplete="off" type="search">

    <div id="usual"></div>
    <div id="all-list"></div>

    <p class="version" id="version"></p>
  </section>

</main>

<!-- ============ TABS ============ -->
<nav class="tabs">
  <button class="tab active" data-tab="trip">
    <span class="tab-icon">🛒</span><span>This trip</span>
  </button>
  <button class="tab" data-tab="all">
    <span class="tab-icon">📋</span><span>All items</span>
  </button>
</nav>

<!-- ============ DETAILS SHEET (the "i" button) ============ -->
<dialog id="info-dialog">
  <form method="dialog" id="info-form">
    <h2 id="info-title">Details</h2>

    <div class="two-up">
      <label>Quantity
        <input name="qty" type="number" min="1" step="1" inputmode="numeric" value="1">
      </label>
      <label>Price each
        <input name="price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="—">
      </label>
    </div>

    <label>Note
      <textarea name="note" rows="3" placeholder="e.g. the big bag, not the small one"></textarea>
    </label>

    <p class="stat" id="info-stat"></p>

    <menu>
      <button type="button" class="danger" id="info-delete">Delete</button>
      <span class="spacer"></span>
      <button type="button" class="ghost" id="info-cancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </menu>
  </form>
</dialog>

<dialog id="store-dialog">
  <form method="dialog" id="store-form">
    <h2 id="store-title">Store</h2>
    <div id="store-options" class="pills"></div>
    <label>Or type a new one
      <input name="newstore" list="store-names" placeholder="e.g. Plaza Vea" autocomplete="off"
             enterkeyhint="done">
    </label>
    <menu>
      <button type="button" class="ghost" id="store-clear">No store</button>
      <span class="spacer"></span>
      <button type="button" class="ghost" id="store-cancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </menu>
  </form>
</dialog>

<datalist id="store-names"></datalist>

<script src="app.js"></script>
</body>
</html>
