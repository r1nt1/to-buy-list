<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Groceries</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>

  <!-- ============ TRIP VIEW ============ -->
  <section class="view" id="view-trip">

    <header class="topbar">
      <h1>This trip</h1>
      <button class="ghost" id="finish-trip">Finish trip</button>
    </header>

    <div class="budget">
      <div class="budget-row">
        <span class="budget-cart" id="budget-cart">$0.00 in cart</span>
        <label class="budget-set">
          budget $
          <input type="number" id="budget-input" min="0" step="1" inputmode="decimal">
        </label>
      </div>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
      <p class="budget-note" id="budget-note"></p>
    </div>

    <form class="add" id="add-form">
      <input id="add-input" placeholder="Add an item…" autocomplete="off"
             enterkeyhint="done" list="pantry-names">
      <datalist id="pantry-names"></datalist>
      <button type="submit">Add</button>
    </form>

    <div id="trip-list"></div>
  </section>

  <!-- ============ PANTRY VIEW ============ -->
  <section class="view hidden" id="view-pantry">

    <header class="topbar">
      <h1>Pantry</h1>
      <span class="count" id="pantry-count"></span>
    </header>

    <p class="explainer">Everything you ever buy lives here. Nothing is ever deleted by
       checking it off — tap an item to put it on this week&rsquo;s trip.</p>

    <input class="search" id="pantry-search" placeholder="Search the pantry…"
           autocomplete="off" type="search">

    <div id="usual"></div>
    <div id="pantry-list"></div>
  </section>

</main>

<!-- ============ BOTTOM TABS ============ -->
<nav class="tabs">
  <button class="tab active" data-tab="trip">
    <span class="tab-icon">🛒</span><span>Trip</span>
  </button>
  <button class="tab" data-tab="pantry">
    <span class="tab-icon">🗄️</span><span>Pantry</span>
  </button>
</nav>

<!-- ============ EDIT SHEET ============ -->
<dialog id="edit-dialog">
  <form method="dialog" id="edit-form">
    <h2 id="edit-title">Edit item</h2>

    <label>Name
      <input name="name" required autocomplete="off">
    </label>

    <label>Category
      <input name="category" placeholder="e.g. Produce" autocomplete="off" list="category-names">
      <datalist id="category-names"></datalist>
    </label>

    <div class="two-up">
      <label>Price each
        <input name="price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="—">
      </label>
      <label>Quantity
        <input name="qty" type="number" min="1" step="1" inputmode="numeric" value="1">
      </label>
    </div>

    <label>Priority
      <select name="priority">
        <option value="must">Must have</option>
        <option value="should">Should get</option>
        <option value="maybe">Nice to have</option>
      </select>
    </label>

    <p class="stat" id="edit-stat"></p>

    <menu>
      <button type="button" class="danger" id="edit-delete">Delete</button>
      <span class="spacer"></span>
      <button type="button" class="ghost" id="edit-cancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </menu>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
