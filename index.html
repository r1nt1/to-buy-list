<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Groceries</title>
<!-- The ?v= number is a cache-buster. Browsers hang on to old copies of
     these files; changing the number forces a fresh download. Bump it
     every release, or the phone keeps running the previous version. -->
<link rel="stylesheet" href="style.css?v=2.4">
</head>
<body>

<main>
  <section class="view" id="view-trip">

    <header class="topbar">
      <span class="count" id="trip-count"></span>
      <button class="ghost" id="new-trip">New trip</button>
    </header>

    <!-- hidden until at least one item has a price -->
    <div class="budget hidden" id="budget">
      <button class="budget-row" id="budget-toggle">
        <span class="budget-cart" id="budget-cart"></span>
        <span class="budget-total" id="budget-total"></span>
        <span class="budget-caret" id="budget-caret">⌄</span>
      </button>
      <div id="budget-detail">
        <label class="budget-set">Budget (optional)
          <input class="field" type="number" id="budget-input" min="0" step="1"
                 inputmode="decimal" placeholder="set a budget">
        </label>
        <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
        <p class="budget-note" id="budget-note"></p>
      </div>
    </div>

    <form class="add" id="add-form">
      <input id="add-input" placeholder="Add an item…" autocomplete="off"
             enterkeyhint="done" list="item-names">
      <datalist id="item-names"></datalist>
      <button type="submit">Add</button>
    </form>

    <div id="trip-list"></div>
    <p class="version" id="version"></p>
  </section>
</main>

<!-- the bottom bar now switches how the list is arranged -->
<nav class="tabs">
  <button class="tab active" data-mode="priority">
    <span class="tab-icon">🔢</span><span>Priority</span>
  </button>
  <button class="tab" data-mode="store">
    <span class="tab-icon">🏪</span><span>Stores</span>
  </button>
</nav>

<!-- details sheet (the "i" button) -->
<dialog id="info-dialog">
  <form method="dialog" id="info-form">
    <h2 id="info-title">Details</h2>

    <div class="two-up">
      <label>Quantity
        <input name="qty" type="number" min="1" step="1" inputmode="numeric" value="1">
      </label>
      <label>Price each
        <input name="price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="—">
      </label>
    </div>

    <label>Note
      <textarea name="note" rows="3" placeholder="e.g. the big bag, not the small one"></textarea>
    </label>

    <p class="stat" id="info-stat"></p>

    <div class="sheet-actions">
      <button type="button" class="ghost" id="info-remove">Remove from this trip</button>
      <button type="button" class="danger" id="info-delete">Delete for good</button>
    </div>

    <menu>
      <span class="spacer"></span>
      <button type="button" class="ghost" id="info-cancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </menu>
  </form>
</dialog>

<!-- store picker (opened by swiping a row left) -->
<dialog id="store-dialog">
  <form method="dialog" id="store-form">
    <h2 id="store-title">Store</h2>
    <div id="store-options" class="pills"></div>
    <label>Or type a new one
      <input name="newstore" list="store-names" placeholder="e.g. Plaza Vea"
             autocomplete="off" enterkeyhint="done">
    </label>
    <menu>
      <button type="button" class="ghost" id="store-clear">No store</button>
      <span class="spacer"></span>
      <button type="button" class="ghost" id="store-cancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </menu>
  </form>
</dialog>

<datalist id="store-names"></datalist>

<script src="app.js?v=2.4"></script>
</body>
</html>
